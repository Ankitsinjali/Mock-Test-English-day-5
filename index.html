<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Grammar Mock Test</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f4f7fb;
        color: #222;
    }

    .container {
        max-width: 850px;
        margin: 30px auto;
        padding: 20px;
    }

    .header {
        background: #2563eb;
        color: white;
        padding: 25px;
        border-radius: 15px;
        text-align: center;
        margin-bottom: 20px;
    }

    .header h1 {
        margin-bottom: 8px;
    }

    .header p {
        opacity: 0.9;
    }

    .info-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: white;
        padding: 15px 20px;
        border-radius: 12px;
        margin-bottom: 15px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    #timer {
        font-size: 20px;
        font-weight: bold;
        color: #dc2626;
    }

    .progress-container {
        width: 100%;
        height: 8px;
        background: #ddd;
        border-radius: 10px;
        margin-bottom: 20px;
        overflow: hidden;
    }

    #progress {
        height: 100%;
        width: 0%;
        background: #2563eb;
        transition: 0.3s;
    }

    .question-card {
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .section-title {
        color: #2563eb;
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 15px;
    }

    .question {
        font-size: 21px;
        font-weight: bold;
        margin-bottom: 25px;
        line-height: 1.5;
    }

    .option {
        display: block;
        padding: 15px;
        border: 2px solid #ddd;
        border-radius: 10px;
        margin: 12px 0;
        cursor: pointer;
        transition: 0.2s;
    }

    .option:hover {
        border-color: #2563eb;
        background: #eff6ff;
    }

    .option input {
        margin-right: 10px;
    }

    .option.selected {
        border-color: #2563eb;
        background: #eff6ff;
    }

    .buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 25px;
        gap: 10px;
    }

    button {
        border: none;
        padding: 13px 25px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
    }

    #prevBtn {
        background: #e5e7eb;
        color: #222;
    }

    #nextBtn,
    #submitBtn {
        background: #2563eb;
        color: white;
    }

    button:hover {
        opacity: 0.9;
    }

    .result {
        display: none;
        background: white;
        padding: 30px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .score {
        font-size: 45px;
        font-weight: bold;
        color: #2563eb;
        margin: 20px;
    }

    .result-info {
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
        margin: 20px 0;
    }

    .result-box {
        padding: 15px 25px;
        border-radius: 10px;
        background: #f3f4f6;
    }

    .correct {
        color: #16a34a;
    }

    .wrong {
        color: #dc2626;
    }

    #review {
        text-align: left;
        margin-top: 30px;
    }

    .review-question {
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 15px;
    }

    .review-question p {
        margin: 7px 0;
    }

    .restart {
        background: #16a34a;
        color: white;
        margin-top: 20px;
    }

    @media (max-width: 600px) {
        .container {
            margin: 10px auto;
            padding: 10px;
        }

        .header h1 {
            font-size: 25px;
        }

        .question {
            font-size: 18px;
        }

        .info-bar {
            font-size: 14px;
        }

        button {
            padding: 11px 16px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>English Grammar Mock Test</h1>
        <p>50 Multiple Choice Questions</p>
    </div>

    <!-- TEST AREA -->
    <div id="testArea">

        <div class="info-bar">
            <strong id="questionNumber">Question 1 of 50</strong>
            <span id="timer">30:00</span>
        </div>

        <div class="progress-container">
            <div id="progress"></div>
        </div>

        <div class="question-card">

            <div class="section-title" id="sectionTitle"></div>

            <div class="question" id="questionText"></div>

            <div id="options"></div>

            <div class="buttons">
                <button id="prevBtn" onclick="previousQuestion()">Previous</button>
                <button id="nextBtn" onclick="nextQuestion()">Next</button>
                <button id="submitBtn" onclick="submitTest()" style="display:none;">
                    Submit Test
                </button>
            </div>

        </div>
    </div>

    <!-- RESULT AREA -->
    <div class="result" id="resultArea">

        <h1>🎉 Test Completed!</h1>

        <div class="score" id="score"></div>

        <div class="result-info">

            <div class="result-box">
                <strong class="correct">Correct</strong>
                <br>
                <span id="correctCount"></span>
            </div>

            <div class="result-box">
                <strong class="wrong">Wrong</strong>
                <br>
                <span id="wrongCount"></span>
            </div>

            <div class="result-box">
                <strong>Percentage</strong>
                <br>
                <span id="percentage"></span>
            </div>

        </div>

        <button class="restart" onclick="restartTest()">
            🔄 Retake Test
        </button>

        <div id="review"></div>

    </div>

</div>


<script>

section: "Part A — Present Simple"
},

{
q: "He ___ his homework every day.",
options: ["do", "does", "doing", "did"],
answer: 1,
section: "Part A — Present Simple"
},

{
q: "My brother ___ football.",
options: ["play", "plays", "playing", "played"],
answer: 1,
section: "Part A — Present Simple"
},

{
q: "She ___ English every morning.",
options: ["study", "studies", "studying", "studied"],
answer: 1,
section: "Part A — Present Simple"
},

{
q: "They ___ to school by bus.",
options: ["goes", "go", "going", "gone"],
answer: 1,

},

/* PART B */

{
q: "I ___ English now.",
options: ["study", "studied", "am studying", "have studied"],
answer: 2,
section: "Part B — Present Continuous"
},

{
q: "She ___ खाना पकाउँदै छ।",
options: ["is cooking", "cooks", "has cooked", "cook"],
answer: 0,
section: "Part B — Present Continuous"
},

{
q: "They ___ football now.",
options: ["play", "are playing", "played", "have played"],

},

{
q: "He ___ a book at the moment.",
options: ["reads", "is reading", "read", "has read"],

section: "Part B — Present Continuous"
},

{

options: ["are learning", "learn", "learned", "have learned"],

section: "Part B — Present Continuous"
},

{

options: ["watches", "watched", "is watching", "has watched"],
answer: 2,
section: "Part B — Present Continuous"
},

{
q: "I ___ not sleeping now.",

},

{
q: "He ___ not working today.",
options: ["are", "is", "does", "has"],
answer: 1,

},

{

options: ["Do", "Does", "Are", "Have"],

},

{

options: ["Is", "Does", "Has", "Do"],

},

{
q: "Look! The baby ___.",
options: ["sleeps", "slept", "is sleeping", "has slept"],

},

{

},

/* PART C */

{
q: "I ___ my homework.",
options: ["have finished", "am finishing", "finish", "finished"],

},

},

},

{

},

options: ["has / eaten", "have / eaten", "am / eating", "do / eat"],

/* PART D */

{
q: "I ___ English for two hours.",
options: ["have been studying", "am studying", "study", "studied"],

section: "Part D — Present Perfect Continuous"
},

{
q: "She ___ since morning.",
options: ["has been working", "have been working", "is work", "works"],

},

{

options: ["has been playing", "have been playing", "are play", "played"],

},

options: ["has been learning", "have been learning", "is learn", "learns"],

},

options: ["have been waiting", "has been waiting", "are wait", "waited"],

},

{

options: ["has been studying", "have been studying", "is study", "studies"],

},

{
q: "I ___ not been sleeping well lately.",
options: ["has", "have", "am", "do"],

},

{
q: "He ___ not been working since Monday.",
options: ["have", "has", "is", "does"],

section: "Part D — Present Perfect Continuous"
},

{
q: "___ you been studying English for two hours?",
options: ["Has", "Have", "Are", "Do"],
answer: 1,
section: "Part D — Present Perfect Continuous"
},

{
q: "___ she been working since morning?",
options: ["Have", "Does", "Has", "Is"],
answer: 2,
section: "Part D — Present Perfect Continuous"
},

{
q: "Since is used with:",
options: [
    "a period of time",
    "a starting point",
    "an object",
    "a person"
],
answer: 1,
section: "Part D — Present Perfect Continuous"
},

{
q: "For is used with:",
options: [
    "a starting point",
    "a period/duration of time",
    "a name",
    "a place"
],
answer: 1,
section: "Part D — Present Perfect Continuous"
}

];


let currentQuestion = 0;
let userAnswers = new Array(questions.length).fill(null);

let timeLeft = 30 * 60;
let timerInterval;


/* LOAD QUESTION */

function loadQuestion() {

    const question = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        `Question ${currentQuestion + 1} of ${questions.length}`;

    document.getElementById("sectionTitle").textContent =
        question.section;

    document.getElementById("questionText").textContent =
        `${currentQuestion + 1}. ${question.q}`;

    const optionsContainer = document.getElementById("options");

    optionsContainer.innerHTML = "";

    question.options.forEach((option, index) => {

        const label = document.createElement("label");

        label.className = "option";

        if (userAnswers[currentQuestion] === index) {
            label.classList.add("selected");
        }

        label.innerHTML = `
            <input
                type="radio"
                name="answer"
                value="${index}"
                ${userAnswers[currentQuestion] === index ? "checked" : ""}
            >
            <strong>${String.fromCharCode(65 + index)})</strong>
            ${option}
        `;

        label.onclick = function() {

            userAnswers[currentQuestion] = index;

            document.querySelectorAll(".option")
                .forEach(o => o.classList.remove("selected"));

            label.classList.add("selected");
        };

        optionsContainer.appendChild(label);
    });


    /* Progress */

    const progress =
        ((currentQuestion + 1) / questions.length) * 100;

    document.getElementById("progress").style.width =
        progress + "%";


    /* Buttons */

    document.getElementById("prevBtn").style.visibility =
        currentQuestion === 0 ? "hidden" : "visible";

    if (currentQuestion === questions.length - 1) {

        document.getElementById("nextBtn").style.display = "none";

        document.getElementById("submitBtn").style.display = "block";

    } else {

        document.getElementById("nextBtn").style.display = "block";

        document.getElementById("submitBtn").style.display = "none";
    }
}


/* NEXT */

function nextQuestion() {

    if (currentQuestion < questions.length - 1) {

        currentQuestion++;

        loadQuestion();
    }
}


/* PREVIOUS */

function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        loadQuestion();
    }
}


/* TIMER */

function startTimer() {

    timerInterval = setInterval(function() {

        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;

        seconds = seconds < 10 ? "0" + seconds : seconds;

        document.getElementById("timer").textContent =
            `${minutes}:${seconds}`;

        if (timeLeft <= 0) {

            clearInterval(timerInterval);

            alert("Time is up! Your test will be submitted.");

            submitTest();
        }

        timeLeft--;

    }, 1000);
}


/* SUBMIT TEST */

function submitTest() {

    clearInterval(timerInterval);

    let correct = 0;

    questions.forEach((question, index) => {

        if (userAnswers[index] === question.answer) {
            correct++;
        }

    });

    const wrong = questions.length - correct;

    const percentage =
        ((correct / questions.length) * 100).toFixed(2);


    document.getElementById("testArea").style.display = "none";

    document.getElementById("resultArea").style.display = "block";


    document.getElementById("score").textContent =
        `${correct} / ${questions.length}`;

    document.getElementById("correctCount").textContent =
        correct;

    document.getElementById("wrongCount").textContent =
        wrong;

    document.getElementById("percentage").textContent =
        percentage + "%";


    showReview();
}


/* REVIEW */

function showReview() {

    const review = document.getElementById("review");

    review.innerHTML = "<h2>📋 Answer Review</h2><br>";

    questions.forEach((question, index) => {

        const userAnswer = userAnswers[index];

        const isCorrect =
            userAnswer === question.answer;

        let userText =
            userAnswer === null
            ? "Not answered"
            : question.options[userAnswer];

        let correctText =
            question.options[question.answer];

        const div = document.createElement("div");

        div.className = "review-question";

        div.innerHTML = `
            <strong>${index + 1}. ${question.q}</strong>

            <p>
                Your answer:
                <span class="${isCorrect ? "correct" : "wrong"}">
                    ${userText}
                </span>
            </p>

            <p>
                Correct answer:
                <span class="correct">
                    ${correctText}
                </span>
            </p>
        `;

        review.appendChild(div);
    });
}


/* RESTART */

function restartTest() {

    currentQuestion = 0;

    userAnswers =
        new Array(questions.length).fill(null);

    timeLeft = 30 * 60;

    document.getElementById("resultArea").style.display =
        "none";

    document.getElementById("testArea").style.display =
        "block";

    loadQuestion();

    startTimer();
}


/* START */

loadQuestion();

startTimer();

</script>

</body>
</html>
